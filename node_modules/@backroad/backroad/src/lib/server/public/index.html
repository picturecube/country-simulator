<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Backroad App</title>
    <base href="/" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // Apply the persisted preference (palette + light/dark) before first
      // paint to avoid a flash of the wrong theme. Reads the same
      // `backroad-preferences` blob the ThemeProvider writes; kept inline +
      // dependency-free so it runs synchronously. Only the user's saved choice
      // is known pre-paint — the app-maker default arrives over the socket and
      // is applied by the ThemeProvider once connected.
      (function () {
        try {
          var prefs = JSON.parse(
            localStorage.getItem('backroad-preferences') || '{}'
          );
          var root = document.documentElement;
          if (prefs.theme && prefs.theme !== 'default')
            root.setAttribute('data-theme', prefs.theme);
          var prefersDark = window.matchMedia(
            '(prefers-color-scheme: dark)'
          ).matches;
          var dark =
            prefs.mode === 'dark' ||
            ((prefs.mode === 'system' || !prefs.mode) && prefersDark);
          root.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-nZCSAfTQ.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BIJIpVtf.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
